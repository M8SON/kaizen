# config/filler_phrases.yaml
#
# Filler-phrase library for the Jev-classified "speak while Claude thinks"
# feature. Each category has:
#   criteria — the natural-language description handed to Jev's Choice
#              primitive so it can classify a transcript against this label.
#   phrases  — one or more spoken lines; a random one is picked each turn so
#              repeated fillers don't sound robotic.
#   prefetch — optional {tool, input}. With TOOL_FIRST_ENABLED=true, Kaizen
#              runs this tool itself as soon as Jev picks the category, and
#              Claude only phrases the answer (skips one Claude round).
#              "{location}" in input resolves via core.location_preference;
#              if it can't be resolved the prefetch is skipped.
#   action   — optional. Kaizen handles the category itself, no Claude and
#              no phrase (e.g. `stop`: stop music / stop responding, chime,
#              back to idle). Uses FILLER_ANSWER_CONFIDENCE_THRESHOLD.
#   min_confidence — optional override of FILLER_ANSWER_CONFIDENCE_THRESHOLD
#              for an answer/action category.
#   answer   — optional, default false. When true the phrase IS the whole
#              reply: it plays instead of calling Claude, and only when Jev's
#              confidence clears FILLER_ANSWER_CONFIDENCE_THRESHOLD. Answer
#              phrases may use {persona} (derived from WAKE_WORD_MODEL at
#              build time, e.g. "Jarvis").
#
# Run scripts/build_filler_audio.py after editing this file to (re)generate
# the cached ElevenLabs audio at ~/.kaizen/filler_audio/.
#
# See docs/superpowers/specs/2026-09-23-jev-filler-response-design.md.

categories:
  weather:
    criteria: "Questions about the weather: current conditions, temperature, rain or snow, or the forecast for today, tomorrow or later in the week (for example \"what's the weather\", \"is it going to rain tomorrow\", \"how cold is it outside\", \"do I need a jacket\", \"what's it like this weekend\")."
    prefetch:
      tool: weather
      input:
        query: "{location}"
        days: 2
    phrases:
      - "Let me check the weather for you."
      - "One moment, pulling up the forecast."

  music:
    criteria: "Requests to play music or change what is playing: a song, artist, album, genre, mood or playlist, or skip, next track, resume, turn it up or down (for example \"play some jazz\", \"put on my workout playlist\", \"play something chill\", \"skip this song\", \"next\", \"resume the music\", \"turn it up\", \"louder\", \"volume down\"). Stopping or pausing is stop."
    phrases:
      - "On it."
      - "Sure thing, one second."

  web_search:
    criteria: "Questions that need looking something up: facts, news, current events, prices, scores, people, places, or reading a web page (for example \"who won the game last night\", \"what's in the news today\", \"how tall is Mount Everest\", \"what's the price of bitcoin\", \"when does the hardware store close\", \"read me this article\")."
    phrases:
      - "Let me look that up."
      - "Give me a second to search for that."

  memory:
    criteria: "Requests to remember, recall or forget a fact or preference, or questions about past conversations (for example \"remember that my dog is called Rex\", \"don't forget I prefer Celsius\", \"what's my sister's name\", \"what did we talk about yesterday\", \"forget my old address\")."
    phrases:
      - "Got it, one moment."
      - "Sure, let me pull that up."

  skill_install:
    criteria: "Requests to add, build or install a new skill or capability, or giving an API key for one (for example \"add a skill that tells me the tides\", \"can you learn to track packages\", \"install the skill from this link\", \"here is my API key\")."
    phrases:
      - "Let's set that up — one moment."
      - "Okay, give me a second to build that."

  schedule:
    criteria: "Requests to set up, list, change or cancel recurring tasks or reminders (for example \"every morning at 8 tell me the weather\", \"what do I have scheduled\", \"cancel my morning briefing\", \"move my briefing to 9\")."
    phrases:
      - "Let me check your schedule."
      - "One moment, checking your calendar."

  smalltalk:
    criteria: "Greetings, thanks, chit-chat, jokes, opinions or comments with no task to look up or perform (for example \"hello\", \"thanks Jarvis\", \"how are you\", \"tell me a joke\", \"what do you think about pizza\", \"that's cool\")."
    phrases:
      - "Mm-hm, one sec."

  identity:
    answer: true
    criteria: "The user asks about the assistant itself: its name, who or what it is, who they are talking to, or what the assistant does or what its job is (for example \"what is your name\", \"who are you\", \"what do you do\", \"who am I talking to\"). Not questions about any other person or thing."
    phrases:
      - "I'm {persona}, Mason's voice assistant. I run right here on a Raspberry Pi."
      - "My name is {persona}. I'm Mason's personal assistant, here to help around the house."

  capabilities:
    answer: true
    criteria: "The user asks in general what the assistant can do or help with. Not a request to actually perform a specific task."
    phrases:
      - "I can check the weather, play music, search the web, set reminders, and remember things for you. If I can't do something yet, I can learn a new skill for it."
      - "Quite a bit. Weather, music, web searches, reminders, and remembering things you tell me. Just ask, and if I can't do it yet, I can learn how."

  stop:
    action: stop
    # On the Pi, real stop requests scored 0.82-1.0 and look-alikes ("don't
    # stop the music", "stop by the store later") 0.43-0.46.
    min_confidence: 0.75
    criteria: "The user wants something to stop right now: the music or audio that is playing, or Jarvis's current reply (for example \"stop\", \"hey Jarvis stop\", \"stop the music\", \"you can stop\", \"that's enough\", \"turn it off\", \"pause\"). Not a goodbye, and not a question that merely mentions stopping."

  general:
    # Fallback bucket for anything that doesn't clearly match another
    # category. Below FILLER_CLASSIFIER_CONFIDENCE_THRESHOLD no filler plays.
    criteria: "Anything that doesn't clearly match another category."
    phrases:
      - "One moment."
      - "Let me think about that."
